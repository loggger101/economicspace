[package]
name = "es_core"
version = "0.1.0"
edition = "2021"
description = "Opt-in Rust ports of economicspace's hottest Stage 4 functions (prototype)"
license = "MIT"
publish = false

[lib]
name = "es_core"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "=0.26.0", features = ["extension-module"] }

[features]
# Builds a copy with a deliberate one-ulp error, so verify_rust.py can prove
# its differential check fails on the smallest drift there is.  Never shipped.
planted_defect = []

[profile.release]
# No fast-math, no FMA contraction: rustc never fuses a*b+c unless asked, and
# nothing here asks.  Bit-identity with CPython's float arithmetic depends on it.
opt-level = 3
lto = true
codegen-units = 1
