[package]
name = "es_core"
version = "0.1.0"
edition = "2021"
description = "Opt-in Rust ports of economicspace's hottest Stage 4 functions (prototype)"
license = "MIT"
publish = false

[lib]
name = "es_core"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "=0.26.0", features = ["extension-module"] }
# spacevalue's knapsack, linked directly so the sizing loop never crosses into
# Python for it.  PROTOTYPE: a path into the sibling checkout on spacevalue's
# `rust-cargo-prototype` branch; a merge would pin it to a git tag that
# matches the spacevalue pin in requirements.txt.
spacevalue_cargo_core = { path = "../../../spacevalue/rust/cargo_core" }

[features]
# Builds a copy with a deliberate one-ulp error, so verify_rust.py can prove
# its differential check fails on the smallest drift there is.  Never shipped.
planted_defect = []
# The same, but only in the sizing loop's damping blend (sizing.rs), so the
# loop's own gate is proven able to see a loop-only drift.
planted_loop_defect = []
# ...and only in the programme ladder's cost tail (ladder.rs).
planted_ladder_defect = []
# ...and only on a hit in the ladder's cross-call helper memo (ladder.rs).
planted_memo_defect = []
# ...and only in spacevalue's knapsack crate (one ulp of every take).
planted_knapsack_defect = ["spacevalue_cargo_core/planted_knapsack_defect"]

[profile.release]
# No fast-math, no FMA contraction: rustc never fuses a*b+c unless asked, and
# nothing here asks.  Bit-identity with CPython's float arithmetic depends on it.
opt-level = 3
lto = true
codegen-units = 1
