# The checks this repo can run WITHOUT the pipeline's inputs.
#
# WHAT IS HERE AND WHAT IS NOT.  `asteroid_pipeline/` is gitignored in full, so
# a fresh clone has the code and none of the gigabytes Stage 4 reads.  That rules
# out `verify.py`, whose checks 1-5 all build cells; it stays a local
# pre-commit harness run against a `.verify` baseline.  What CI can prove is
# everything that needs no catalog: that `master.py` still imports the modules
# it re-exports, that the docs still describe the code, that the
# pinned catalog release exists at our data contract, and that the Stage 3
# split has not drifted.  All but the Stage 1 check (added with the pinned
# release, 2026-09-23) were hand-run until 2026-09-15, and therefore ran only
# when somebody remembered.
#
# platform_check.py is deliberately NOT a gate.  A GitHub runner is glibc on
# x86-64 and the reference host is the Windows UCRT, so a libm probe DIFFERING
# here is the expected answer rather than a finding -- CLAUDE.md's rule is
# "bit-identity across hosts is not promised; platform_check.py says whether
# hashes are comparable".  A gate that is red by construction is
# the cry-wolf failure this repo already records twice, so it runs for the
# report and cannot fail the job.
name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out economicspace
        uses: actions/checkout@v4

      # 3.13 is what the Dockerfile and requirements-lock.txt pin, and what
      # platform_reference.json was recorded on.  Not spelled more precisely
      # than the minor: CLAUDE.md deletes the interpreter version from prose
      # for the reason it rotted three times in six days, and the patch level
      # is the runner's to choose.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      # The lock pins the versions every committed number was measured on; it
      # does NOT carry the tagged git URL for spacecost (Stage 3's tables),
      # which lives in the loose list.  Installing both files in ONE resolve
      # means the `==` pins win and the package arrives at its pinned tag, with
      # no version typed here.  A second split needs no edit to this step.
      # Stage 1 installs no package: it downloads a pinned catalog release.
      # requirements-verify.txt is samebytes, the toolkit tree_check.py,
      # platform_check.py and verify.py hand over to.  Installed here in the
      # same resolve, so the guard in modules/_runtime.py finds the pinned tag
      # and installs nothing at run time.
      - name: Install dependencies
        run: python -m pip install --upgrade pip
          && python -m pip install -r requirements-lock.txt -r requirements.txt
             -r requirements-verify.txt

      # The control case for tree_check.py. On a plain clone this can only
      # pass, which is the point: it proves the check itself still works and
      # that its skip path is NOT what CI is exercising. The failure it guards
      # is a synced-folder mount serving stale or absent bytes, which no
      # runner has, so this is the only place its clean answer is ever seen.
      - name: Working tree matches the index
        run: python tree_check.py

      # The .githooks/ copies are samebytes' packaged hooks: drift, CRLF, a
      # missing eol=lf pin or a missing executable bit each makes a copy
      # silently useless after a checkout.  core.hooksPath is not required: a
      # fresh clone has not opted in.
      - name: Hooks match samebytes
        run: python -m samebytes hooks check .

      # A hard step on purpose: verify_docs.py check 18 resolves every
      # `master.<name>` the repo reads, but it SKIPS when the import fails,
      # and a skip on every CI run is a check that does not exist.  The import
      # is also the Stage 3 seam: modules/_runtime.py refuses a spacecost that
      # pip did not install from the pinned tag.
      - name: master.py imports
        run: python -c "import master"

      - name: Documentation checks
        run: python verify_docs.py

      # Check 1 is the seam: the pinned catalog release exists and is this
      # pipeline's data contract.  It reads only the release's manifest, so it
      # runs here and catches a pin that names nothing before anybody runs
      # Stage 1.
      # Checks 3, 4 and 8 need the installed catalog, which is
      # gitignored, so they skip here and say so.
      - name: Stage 1 catalog release
        run: python verify_stage1.py

      # Informational only: see the header.  What it is worth here is the
      # answer to "how far does a Linux x86-64 runner diverge from the
      # reference host", which is a question SPARK_SETUP.md asks and nothing
      # had ever recorded.
      - name: Numeric platform probes (report only, never a gate)
        continue-on-error: true
        run: python platform_check.py
